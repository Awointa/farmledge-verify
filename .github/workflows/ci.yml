name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * *' # daily: the Testnet example must keep verifying

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Conformance: every fixture through the browser verifier and
      # verify_proof.py; any disagreement fails.
      - run: npm test
      # Every check in the browser verifier must be caught by some test.
      - run: node test/mutate.js

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:live
